account:
  starting_balance_usdt: 1000
  risk_per_trade_pct: 1.0
  max_open_positions: 5
  max_coin_allocation_pct: 20.0

universe:
  min_market_cap_usd: 50000000
  max_market_cap_usd: 200000000
  top_n: 20
  quote_asset: USDT
  excluded_symbols: [USDC, USDT, DAI, FDUSD, TUSD]

runtime:
  cycle_seconds: 180
  candle_interval: 1m
  candle_limit: 120
  paper_fee_pct: 0.10
  dashboard_html: dashboard.html
  csv_trade_log: trades.csv
  csv_equity_log: equity.csv

risk:
  default_stop_loss_pct: 0.80
  default_take_profit_pct: 1.20
  trailing_stop_pct: 0.60
  cooldown_after_trade_minutes: 10

signals:
  min_total_score_to_enter: 2
  orderbook_imbalance_buy_threshold: 0.58
  orderbook_imbalance_sell_threshold: 0.42

sheets:
  enabled: false
  spreadsheet_name: Crypto Scalper Paper Trades
  worksheet_name: Trades
  service_account_json: service_account.json
